[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluoroview-pipeline"
version = "0.1.0"
description = "Offline asset pipeline for the FluoroView educational CT-to-fluoroscopy simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "pydicom>=2.4",
  "SimpleITK>=2.3",
  "pillow>=10.0",
  "pynrrd>=1.0",
  "h5py>=3.10",
  "trimesh[easy]>=4.0",
  "pygltflib>=1.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.8"]
tigre = []
vtk = ["vtk>=9.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
