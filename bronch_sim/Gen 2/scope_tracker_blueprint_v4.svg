  <text class="st26" transform="translate(400 1335)"><tspan x="0" y="0">6-conductor shielded cable: SDA+/SDA-, SCL+/SCL-, 3V3, GND</tspan></text>
  <text class="st22" transform="translate(100 1385)"><tspan x="0" y="0">Design rule: no Web Bluetooth phase. The cable is not a compromise; it</tspan></text>
  <text class="st22" transform="translate(100 1416.25)"><tspan x="0" y="0">reproduces the bronchoscope umbilical and keeps all sensor fusion on one</tspan></text>
  <text class="st22" transform="translate(100 1447.5)"><tspan x="0" y="0">RP2040 timebase.</tspan></text>
  <circle class="st51" cx="1283" cy="918" r="8"/>
  <text class="st19" transform="translate(1305 928)"><tspan x="0" y="0">Lubrication</tspan></text>
  <text class="st26" transform="translate(1475 928)"><tspan x="0" y="0">SQUAL stays above threshold after silicone-lube challenge with</tspan></text>
  <text class="st26" transform="translate(1475 958)"><tspan x="0" y="0">wiper installed.</tspan></text>
  <circle class="st51" cx="1283" cy="1004" r="8"/>
  <text class="st19" transform="translate(1305 1014)"><tspan x="0" y="0">Depth</tspan></text>
  <text class="st26" transform="translate(1475 1014)"><tspan x="0" y="0">&lt;= +/-5 mm error over 300 mm; &lt;= +/-3 mm repeatability over 10</tspan></text>
  <text class="st26" transform="translate(1475 1044)"><tspan x="0" y="0">cycles.</tspan></text>
  <circle class="st51" cx="1283" cy="1090" r="8"/>
  <text class="st19" transform="translate(1305 1100)"><tspan x="0" y="0">Roll</tspan></text>
  <text class="st26" transform="translate(1475 1100)"><tspan x="0" y="0">&lt;= +/-10-15 deg error over 360 deg during isolated and helical</tspan></text>
  <text class="st26" transform="translate(1475 1130)"><tspan x="0" y="0">motion.</tspan></text>
  <circle class="st51" cx="1283" cy="1176" r="8"/>
  <text class="st19" transform="translate(1305 1186)"><tspan x="0" y="0">Friction</tspan></text>
  <text class="st26" transform="translate(1475 1186)"><tspan x="0" y="0">Added insertion force target &lt;0.5 N after wiper and V-groove</tspan></text>
  <text class="st26" transform="translate(1475 1216)"><tspan x="0" y="0">are installed.</tspan></text>
  <circle class="st51" cx="1283" cy="1262" r="8"/>
  <text class="st19" transform="translate(1305 1272)"><tspan x="0" y="0">Cable</tspan></text>
  <text class="st26" transform="translate(1475 1272)"><tspan x="0" y="0">No bus lockups or dropped lever frames during 30-min moving-</tspan></text>
  <text class="st26" transform="translate(1475 1302)"><tspan x="0" y="0">cable test.</tspan></text>
  <circle class="st51" cx="1283" cy="1348" r="8"/>
  <text class="st19" transform="translate(1305 1358)"><tspan x="0" y="0">Durability</tspan></text>
  <text class="st26" transform="translate(1475 1358)"><tspan x="0" y="0">50-100 clamp cycles; wiper cassette replaceable without tools.</tspan></text>
  <text class="st27" transform="translate(1265 1385)"><tspan x="0" y="0">Phase gate: do not start multi-scope adapters until the lubricated-</tspan></text>
  <text class="st27" transform="translate(1265 1417.5)"><tspan x="0" y="0">cord, V-groove standoff, and differential-cable tests all pass.</tspan></text>
  <text class="st14" transform="translate(60 1525)"><tspan x="0" y="0">Training/simulation use only - nonclinical prototype - adapter-supported disposable bronchoscopes</tspan></text>
