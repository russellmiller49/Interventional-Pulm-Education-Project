<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Predict and reveal the route of airflow with a one-way speaking valve and fully deflated cuff">
    <defs>
      <linearGradient id="slide-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#07101f"/>
        <stop offset="0.56" stop-color="#0b1223"/>
        <stop offset="1" stop-color="#0b2a43"/>
      </linearGradient>
      <linearGradient id="accent-line" x1="0" x2="1">
        <stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/>
        <stop offset="1" stop-color="#a78bfa" stop-opacity=".15"/>
      </linearGradient>
      <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#020617" flood-opacity=".45"/>
      </filter>
    </defs>

    <rect width="1920" height="1080" fill="url(#slide-bg)"/>
    <circle cx="1770" cy="90" r="330" fill="#38bdf8" opacity=".035"/>
    <circle cx="1510" cy="940" r="430" fill="#a78bfa" opacity=".025"/>
    <rect x="72" y="68" width="590" height="3" rx="2" fill="url(#accent-line)"/>
    <text x="78" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#7dd3fc">ANIMATED PHYSIOLOGY LAB</text>

    <g opacity="1.000" font-family="Arial, Helvetica, sans-serif">
      <text x="78" y="215" font-size="64" font-weight="700" fill="#f8fafc" filter="url(#text-shadow)">Predict the route of airflow</text>
      <text x="80" y="272" font-size="28" fill="#cbd5e1">Speaking valve in place · cuff fully deflated</text>

      <text x="80" y="370" font-size="18" font-weight="700" letter-spacing="2.8" fill="#94a3b8">TRACE BOTH PATHS</text>

      <circle cx="96" cy="450" r="12" fill="#22d3ee"/>
      <text x="126" y="458" font-size="24" font-weight="700" letter-spacing="1.5" fill="#a5f3fc">INSPIRATION</text>
      <text x="126" y="505" font-size="34" fill="#f8fafc">Where does inhaled gas enter?</text>
      <line x1="126" y1="538" x2="680" y2="538" stroke="#38bdf8" stroke-width="3" stroke-opacity=".45"/>

      <circle cx="96" cy="638" r="12" fill="#c084fc"/>
      <text x="126" y="646" font-size="24" font-weight="700" letter-spacing="1.5" fill="#e9d5ff">EXPIRATION</text>
      <text x="126" y="693" font-size="34" fill="#f8fafc">Where can exhaled gas exit?</text>
      <line x1="126" y1="726" x2="680" y2="726" stroke="#c084fc" stroke-width="3" stroke-opacity=".45"/>

      <text x="80" y="824" font-size="27" fill="#cbd5e1">Commit to both routes before revealing the answer.</text>
      <text x="80" y="1010" font-size="19" fill="#94a3b8">For education only. Confirm cuff deflation and upper-airway patency; follow local policy and device instructions.</text>
    </g>

    <g opacity="0.000" font-family="Arial, Helvetica, sans-serif">
      <text x="78" y="202" font-size="57" font-weight="700" fill="#f8fafc" filter="url(#text-shadow)">In through the tube.</text>
      <text x="78" y="268" font-size="57" font-weight="700" fill="#f8fafc" filter="url(#text-shadow)">Out through the upper airway.</text>
      <text x="80" y="323" font-size="26" fill="#cbd5e1">A one-way valve opens for inspiration and closes for expiration.</text>

      <circle cx="96" cy="418" r="12" fill="#22d3ee"/>
      <text x="126" y="426" font-size="23" font-weight="700" letter-spacing="1.5" fill="#a5f3fc">INSPIRATION</text>
      <text x="126" y="475" font-size="34" fill="#f8fafc">Through the tracheostomy tube</text>

      <circle cx="96" cy="573" r="12" fill="#c084fc"/>
      <text x="126" y="581" font-size="23" font-weight="700" letter-spacing="1.5" fill="#e9d5ff">EXPIRATION</text>
      <text x="126" y="630" font-size="34" fill="#f8fafc">Around the tube → through the larynx</text>
      <text x="126" y="676" font-size="34" fill="#f8fafc">→ out of the mouth and nose</text>

      <text x="80" y="766" font-size="25" fill="#cbd5e1">The cuff must be fully deflated, with a patent expiratory</text>
      <text x="80" y="803" font-size="25" fill="#cbd5e1">route around the tube and through the upper airway.</text>

      <rect x="72" y="868" width="676" height="120" rx="22" fill="#4c1021" stroke="#fb7185" stroke-width="2" stroke-opacity=".75"/>
      <circle cx="108" cy="928" r="18" fill="none" stroke="#fecdd3" stroke-width="3"/>
      <text x="103" y="937" font-size="25" font-weight="700" fill="#fecdd3">!</text>
      <text x="144" y="916" font-size="22" font-weight="700" fill="#fff1f2">Never use a one-way speaking valve</text>
      <text x="144" y="950" font-size="22" fill="#ffe4e6">with an inflated cuff.</text>
      <text x="80" y="1032" font-size="18" fill="#94a3b8">Educational visual · follow local policy and the device instructions for use.</text>
    </g>

    
    <g transform="translate(820 0) scale(1.78)">
      <defs>
        <linearGradient id="skin-gradient" x1="0" x2="1">
          <stop offset="0" stop-color="#7c4a45"/>
          <stop offset="1" stop-color="#b9786c"/>
        </linearGradient>
        <linearGradient id="tube-gradient" x1="0" x2="1">
          <stop offset="0" stop-color="#bfdbfe"/>
          <stop offset="0.5" stop-color="#f8fafc"/>
          <stop offset="1" stop-color="#7dd3fc"/>
        </linearGradient>
        <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L7,3 z" fill="#22d3ee"/>
        </marker>
        <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L7,3 z" fill="#c084fc"/>
        </marker>
        <filter id="diagram-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#020617" flood-opacity=".42"/>
        </filter>
      </defs>

      <path d="M180 72 C260 78 314 127 323 195 C332 262 316 311 325 382 C334 453 356 514 365 570 L496 570 C485 497 468 425 464 355 C460 284 484 205 450 139 C417 76 340 45 270 48Z" fill="url(#skin-gradient)" opacity=".35"/>
      <path d="M321 92 C354 125 355 161 341 196 C330 225 329 257 339 291 L343 505" fill="none" stroke="#e2e8f0" stroke-width="46" stroke-linecap="round" opacity=".28"/>
      <path d="M316 260 Q342 247 368 260" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M316 296 Q342 283 368 296" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M316 332 Q342 319 368 332" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M316 368 Q342 355 368 368" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M316 404 Q342 391 368 404" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M316 440 Q342 427 368 440" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M316 476 Q342 463 368 476" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M316 512 Q342 499 368 512" fill="none" stroke="#dbeafe" stroke-width="7" stroke-linecap="round" opacity=".8"/>
      <path d="M190 316 C234 315 279 321 318 345 C346 362 359 403 357 473" fill="none" stroke="#64748b" stroke-width="66" stroke-linecap="round" filter="url(#diagram-shadow)"/>
      <path d="M190 316 C234 315 279 321 318 345 C346 362 359 403 357 473" fill="none" stroke="url(#tube-gradient)" stroke-width="48" stroke-linecap="round"/>
      <rect x="155" y="277" width="94" height="78" rx="20" fill="#e2e8f0" stroke="#7dd3fc" stroke-width="5"/>
      <rect x="87" y="291" width="90" height="50" rx="18" fill="#dbeafe" stroke="#7dd3fc" stroke-width="5"/>
      <ellipse cx="356" cy="426" rx="27" ry="22" fill="#5eead4" stroke="#2dd4bf" stroke-width="5" opacity=".38"/>

      <g aria-label="One-way speaking valve">
        <path d="M90 282 h-22 v70 h22" fill="#c084fc" opacity=".88"/>
        <path d="M75 304 l-18 12 18 12z" fill="#f5d0fe"/>
      </g>

      <g opacity="0.000">
        <path d="M82 316 C153 316 228 316 296 350 C326 365 345 399 353 467" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 14" stroke-dashoffset="0" marker-end="url(#arrow-cyan)"/>
        <path d="M355 470 C350 409 347 344 342 286 C337 231 336 191 308 155 C283 123 252 111 220 105" fill="none" stroke="#c084fc" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 14" stroke-dashoffset="0" marker-end="url(#arrow-violet)"/>
      </g>

      <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e2e8f0">
        <text x="140" y="80">Mouth and upper airway</text>
        <text x="381" y="280">Trachea</text>
        <text x="52" y="382">One-way speaking valve</text>
        <text x="387" y="432">Cuff fully deflated</text>
      </g>
      <g opacity="0.000" font-family="Arial, Helvetica, sans-serif" font-size="15">
        <circle cx="92" cy="545" r="7" fill="#22d3ee"/>
        <text x="108" y="550" fill="#bae6fd">Inspiration</text>
        <circle cx="230" cy="545" r="7" fill="#c084fc"/>
        <text x="246" y="550" fill="#e9d5ff">Expiration</text>
      </g>
    </g>
  </svg>