      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="sector">
      <path d="M260 22 C130 118, 58 330, 36 604 L484 604 C462 330, 390 118, 260 22 Z"/>
    </clipPath>
  </defs>
  <rect width="520" height="620" fill="#000"/>
