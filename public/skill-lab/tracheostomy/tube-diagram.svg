    <rect x="88" y="217" width="118" height="56" rx="24" fill="url(#tube)" stroke="#64748b" stroke-width="7"/>
    <rect x="353" y="133" width="92" height="224" rx="28" fill="#f1f5f9" stroke="#64748b" stroke-width="8"/>
    <path d="M374 159h50M374 331h50" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
