<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Neutral tracheostomy tube component diagram</title>
  <desc id="desc">A side-view medical equipment diagram with an unlabeled tube, neck flange, removable inner tube, inflatable seal, inflation line, and pilot balloon.</desc>
  <defs>
    <linearGradient id="tube" x1="0" x2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="cuff" x1="0" x2="1">
      <stop offset="0" stop-color="#99f6e4" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#ccfbf1" stop-opacity=".82"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="36" fill="#f8fafc"/>
  <g opacity=".55" stroke="#cbd5e1" stroke-width="2">
