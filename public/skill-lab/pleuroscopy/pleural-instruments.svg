<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="Schematic of three separate hand instruments: a long jawed instrument, a bulb-and-nozzle device, and a curved drainage tube with side eyelets">
  <rect width="480" height="240" fill="none"/>

  <!-- Instrument A: long jawed instrument (left) -->
  <line x1="20" y1="150" x2="70" y2="120" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="150" x2="70" y2="132" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M70 120 L104 108 M70 132 L104 132" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M104 108 L118 116 M104 132 L118 124" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Instrument B: bulb-and-nozzle device (middle) -->
  <ellipse cx="212" cy="130" rx="34" ry="26" fill="#dbe4ee" stroke="#334155" stroke-width="2.5"/>
  <rect x="244" y="122" width="40" height="16" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2.5"/>
  <path d="M284 130 L300 124 L300 136 Z" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
    <line x1="302" y1="130" x2="316" y2="124"/>
    <line x1="302" y1="130" x2="316" y2="130"/>
    <line x1="302" y1="130" x2="316" y2="136"/>
  </g>

  <!-- Instrument C: curved drainage tube with side eyelets (right) -->
  <path d="M360 60 Q470 90 430 200" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  <path d="M360 60 Q470 90 430 200" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="392" cy="72" r="4.5" fill="#334155"/>
  <circle cx="418" cy="92" r="4.5" fill="#334155"/>
  <circle cx="432" cy="120" r="4.5" fill="#334155"/>
</svg>
