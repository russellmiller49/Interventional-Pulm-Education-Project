<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Archived Airway Stent Engineering Prototype</title>
<link rel="canonical" href="/airway-stent-mechanics?station=architecture-lumen" />
<style>
  :root{
    --bg:#0a0f1c; --bg2:#0d1526; --panel:#0f1a2e; --panel2:#152540;
    --line:#22344f; --ink:#e8eef8; --muted:#93a5c0; --dim:#6f83a1;
    --accent:#4cc2ff; --accent2:#fb7185; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;min-height:0}

  .archive-banner{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px;
    background:#3a2b0b;border-bottom:1px solid #8f6c18;color:#fff2bd;font-size:12px;line-height:1.45;text-align:center}
  .archive-banner a{color:#fff;text-decoration:underline;text-underline-offset:2px;font-weight:700}

  /* ---- stepper header ---- */
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;
    background:linear-gradient(180deg,#0e1a30,#0b1526);border-bottom:1px solid var(--line)}
  .brand{font-weight:750;font-size:14px;letter-spacing:.2px;white-space:nowrap}
  .brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
  .steps{display:flex;gap:5px;flex:1;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9px;
    background:#12203a;border:1px solid var(--line);color:var(--muted);cursor:pointer;
    font-size:12px;font-weight:600;transition:.14s;white-space:nowrap}
  .step .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:50%;background:#22344f;color:#cfe0f5;font-size:11px;font-weight:700;flex:none}
  .step:hover{border-color:#33517a}
  .step.on{background:#103154;border-color:var(--accent);color:#fff}
  .step.on .n{background:var(--accent);color:#04121f}
  .step.done .n{background:var(--good);color:#04121f}

  /* ---- main split ---- */
  #main{display:grid;grid-template-columns:1fr 384px;min-height:0}
  #stage{position:relative;min-width:0;background:radial-gradient(120% 90% at 50% 8%,#152742 0%,#0a0f1c 66%)}
  canvas{display:block}
  #overlay{position:absolute;left:16px;top:14px;pointer-events:none;max-width:64%}
  #eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700}
  #sceneTitle{font-size:17px;font-weight:750;margin-top:2px}
  #phaseTag{margin-top:11px;display:none;gap:8px;align-items:center;
    background:#0c1728cc;border:1px solid var(--line);border-radius:999px;padding:5px 12px;
    font-size:12px;font-weight:600;width:max-content}
  #phaseDot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  #caption{position:absolute;left:16px;bottom:14px;right:16px;max-width:660px;
    background:#0a1120e6;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:12.5px;line-height:1.55;color:#d3ddee;pointer-events:none;display:none}
  #caption b{color:#fff}
  .hint{position:absolute;right:14px;bottom:14px;font-size:10.5px;color:var(--dim);pointer-events:none}

  /* ---- rail ---- */
  aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 48px}
  aside::-webkit-scrollbar{width:9px}aside::-webkit-scrollbar-thumb{background:#20324d;border-radius:9px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:22px 0 9px;font-weight:700}
  h2:first-child{margin-top:0}
  p.lead{font-size:13px;line-height:1.6;color:#cdd8ea;margin:0 0 12px}
  .obj{list-style:none;padding:0;margin:6px 0 4px}
  .obj li{position:relative;padding:5px 0 5px 22px;font-size:12.5px;line-height:1.45;color:#c7d3e6}
  .obj li::before{content:"";position:absolute;left:3px;top:10px;width:8px;height:8px;border-radius:2px;
    background:var(--accent)}
  .navbtns{display:flex;gap:8px;margin-top:22px}
  .navbtns button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:12.5px;font-weight:650;cursor:pointer;transition:.14s}
  .navbtns button.primary{background:#12456f;border-color:var(--accent);color:#fff}
  .navbtns button:disabled{opacity:.38;cursor:default}

  /* stent gallery */
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;transition:.14s}
  .card:hover{border-color:#34517a}
  .card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:#0f2942}
  .card .fam{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .card .nm{font-size:12.5px;font-weight:700;margin-top:2px;line-height:1.2}
  .card .mt{font-size:10.5px;color:var(--dim);margin-top:3px}
  .cardDetail{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px}
  .cardDetail .dnm{font-size:13.5px;font-weight:750}
  .cardDetail .dfam{font-size:11px;color:var(--muted);margin-top:1px}
  .cardDetail p{font-size:12px;line-height:1.5;color:#c7d3e6;margin:9px 0}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .twocol h4{margin:0 0 5px;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  .twocol.s h4{color:var(--good)} .twocol.t h4{color:var(--warn)}
  .twocol ul{margin:0;padding-left:15px} .twocol li{font-size:11px;line-height:1.4;color:#c0cde0;margin-bottom:3px}
  .sig{display:flex;gap:8px;margin-top:10px}
  .sig .chip{flex:1;background:#0c1728;border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:center}
  .sig .chip .k{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
  .sig .chip .v{font-size:15px;font-weight:750;margin-top:1px;font-variant-numeric:tabular-nums}

  /* controls */
  .ctl{margin:12px 0}
  .ctl .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
  .ctl .row .v{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:700}
  .ctl.disabled{opacity:.4;pointer-events:none}
  input[type=range]{width:100%;margin:7px 0 0;accent-color:var(--accent)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .btns button,.toggle{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
  .toggle{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:8px}
  .toggle .pill{font-size:10.5px;padding:2px 9px;border-radius:999px;background:#26364e;color:var(--muted)}
  .toggle.on{border-color:var(--accent);color:#fff}.toggle.on .pill{background:var(--accent);color:#04121f}
  .btns button.live{border-color:var(--accent);color:#fff;background:#0e2a44}
  button.cough{grid-column:1/3;background:#3a1720;border-color:#7f3547;color:#ffd7de}
  button.cough:hover{background:#4d1d2a}
  .typemini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:6px}
  .typemini button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;
    padding:7px 4px;font-size:10.5px;font-weight:650;cursor:pointer;line-height:1.15;transition:.12s}
  .typemini button.on{background:#0f2942;border-color:var(--accent);color:#fff}

  /* stats */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .stat .k{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.25}
  .stat .val{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
  .stat .val small{font-size:11px;font-weight:600;color:var(--muted)}
  .stat.wide{grid-column:1/3}
  .bar{height:6px;border-radius:999px;background:#12203a;margin-top:7px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .12s}
  .fsnote{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}

  /* tissue */
  .mech{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
  .mech:first-of-type{border-top:none}
  .mech .sw{width:11px;height:11px;border-radius:3px;margin-top:3px;flex:none}
  .mech .mnm{font-size:12.5px;font-weight:700}
  .mech .mmech{font-size:11.5px;color:#c1cde0;line-height:1.45;margin-top:2px}
  .mech .mout{font-size:11px;color:var(--warn);margin-top:3px}
  table.bench{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
  table.bench th,table.bench td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
  table.bench th{background:#12203a;color:var(--muted);font-weight:650}
  table.bench td b{color:#fff}

  /* assessment */
  .scenario{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:12px}
  .scenario .st{font-size:13px;font-weight:750}
  .scenario .stem{font-size:12px;color:#c7d3e6;line-height:1.5;margin:7px 0}
  .scenario .pr{font-size:12px;font-weight:650;color:#dbe6f5;margin:8px 0 6px}
  .choice{display:block;width:100%;text-align:left;background:#0c1728;border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;font-size:12px;color:#d3ddee;cursor:pointer;margin-bottom:6px;transition:.12s;line-height:1.4}
  .choice:hover{border-color:#34517a}
  .choice.correct{border-color:var(--good);background:#0e2c22}
  .choice.wrong{border-color:var(--bad);background:#301620}
  .rationale{font-size:11.5px;line-height:1.5;color:#c7d3e6;margin-top:6px;padding:9px 11px;
    border-left:3px solid var(--accent);background:#0c1728;border-radius:0 8px 8px 0;display:none}
  .rationale.show{display:block}

  /* references */
  .refs{list-style:none;padding:0;margin:0;counter-reset:r}
  .refs li{font-size:11px;line-height:1.5;color:#bccbe0;padding:8px 0;border-top:1px solid var(--line);display:flex;gap:9px}
  .refs li:first-child{border-top:none}
  .refs .rid{color:var(--accent);font-weight:700;flex:none}
  .tag{font-size:9px;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:5px;margin-left:6px;
    background:#22344f;color:#9db4d4}
  .check{list-style:none;padding:0;margin:6px 0}
  .check li{position:relative;padding:6px 0 6px 24px;font-size:12px;line-height:1.45;color:#c7d3e6}
  .check li::before{content:"✓";position:absolute;left:4px;top:6px;color:var(--good);font-weight:800}
  .disclaimer{font-size:10.5px;color:var(--dim);line-height:1.55;margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
  .disclaimer a{color:#7fb6d8}
  details{margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:2px 11px;background:var(--panel2)}
  summary{cursor:pointer;font-size:11.5px;font-weight:650;color:var(--muted);padding:8px 0}
  .tax{padding:0 0 8px} .tax .tt{font-size:12px;font-weight:700;color:#dbe6f5}
  .tax .td{font-size:11px;color:#c1cde0;line-height:1.45;margin:2px 0}
  .tax .tc{font-size:10.5px;color:var(--warn);margin-bottom:8px}

  @media (max-width:820px){
    #main{grid-template-columns:1fr}
    #stage{position:sticky;top:0;height:56vh;z-index:2}
    aside{border-left:none;border-top:1px solid var(--line)}
    .steps{display:none}
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';

/* ================================================================= constants */
const D0_MM = 14.0;     // free deployed diameter (Ratnovsky airway range 14–16 mm)
const L0_MM = 40.0;     // free deployed length
const RS = 1.0;         // render radius
const LS = 3.4;         // render length
const DEG = Math.PI / 180;

/* ================================================================= content (ported from src/features/airway-stent-mechanics/content) */
const FORCE_TAXONOMY = [
  { t:'Chronic outward force (COF)', d:'Outward support read from the unloading/expansion path at a constrained diameter.', c:'Not interchangeable with the force required to compress the device.' },
  { t:'Radial resistive force (RRF)', d:'Force required to compress the device on the loading path.', c:'Flat-plate RRF also contains local bending, ovalization, and buckling.' },
  { t:'Radial stiffness', d:'The slope dF/dD across a stated diameter interval.', c:'A single peak hides how fast wall load changes with a small diameter change.' },
  { t:'Collapse pressure / strength', d:'External load producing a defined loss of diameter, buckling, or permanent set.', c:'Endpoint, fixture, length, rate, temperature, and orientation must accompany the value.' },
  { t:'Apparent contact pressure', d:'Average contact load divided by effective contact area.', c:'Peak pressure at a wire, stud, flare, connector, or end may be far higher.' },
  { t:'Hysteresis', d:'Separation between compression and expansion curves at the same diameter.', c:'Reflects energy dissipation, wire friction, material behavior, and test history.' },
];
const TISSUE_MECHANISMS = [
  { id:'pressure', label:'Static pressure', color:'#ef4444', mechanism:'Local normal force over a small contact area can compromise microcirculation.', outcomes:'Ischemia, ulceration, necrosis, erosion' },
  { id:'edge', label:'Edge and end loading', color:'#f59e0b', mechanism:'Straightening force and stiffness transitions concentrate load at device ends.', outcomes:'End granulation, focal injury, outer-curve pressure' },
  { id:'shear', label:'Cyclic shear', color:'#8b5cf6', mechanism:'Cough, breathing, swallowing, and micromotion repeatedly rub the tissue interface.', outcomes:'Inflammation, granulation, cover wear' },
  { id:'ingrowth', label:'Tissue ingrowth', color:'#22c55e', mechanism:'Uncovered cells permit incorporation that improves fixation but couples tissue to the scaffold.', outcomes:'Restenosis and difficult or hazardous removal' },
  { id:'mucus', label:'Mucus and biofilm', color:'#06b6d4', mechanism:'Covers interrupt ciliary transport; gaps and roughness create stagnant pockets.', outcomes:'Pooling, plugging, infection, malodor' },
  { id:'fatigue', label:'Scaffold and cover fatigue', color:'#f43f5e', mechanism:'Combined radial, bending, torsional, and axial cycles focus strain at architectural hot spots.', outcomes:'Wire fracture, silicone tear, delamination, loss of support' },
];
const BENCH_DATA = [
  { metric:'Anti-migration force', dumon:'12.83 ± 0.23 N', gina:'15.21 N fwd; 18.40 N back', method:'5-cm push, 16-mm-ID jig' },
  { metric:'Expansion / compression force', dumon:'14.54 ± 0.27 N', gina:'11.91 ± 0.21 N', method:'Flat-plate to 50% diameter' },
  { metric:'Flexibility force', dumon:'4.47 ± 0.10 N', gina:'3.13 ± 0.06 N', method:'4-cm span, half-diameter deflection' },
];
const SCENARIOS = [
  { id:'curved-mainstem', title:'The curved mainstem trap',
    stem:'A rigidly constrained left mainstem segment is sharply curved. A candidate scaffold has strong radial support but also high spring-back.',
    prompt:'Which property must be checked before increasing diameter to gain more support?',
    choices:[
      {id:'a', label:'Axial force plus lumen area in the bend', ok:true, rationale:'Evaluate whether the device follows the centerline without inner-curve gapping, outer-curve pressure, or ovalization. Bending force alone cannot show whether the lumen is preserved.'},
      {id:'b', label:'Peak flat-plate radial force only', ok:false, rationale:'A peak compression value does not measure straightening, gapping, or area retention.'},
      {id:'c', label:'Whether the catalog calls it silicone or metal', ok:false, rationale:'Material family does not specify the finished architecture or its axial response.'},
    ], refs:'5, 12, 22' },
  { id:'migration-force', title:'Anchoring without brute force',
    stem:'Two molded silicone designs share an outer diameter. One has lower whole-body compression force but directional rings and a dynamic posterior section.',
    prompt:'Can the lower-force design still resist migration better?',
    choices:[
      {id:'a', label:'Yes — surface geometry can raise directional anchoring', ok:true, rationale:'Friction, rings, studs, taper, and geometry change migration resistance independently of global compression force. The GINA stent showed higher directional anti-migration force despite lower compression and flexibility forces.'},
      {id:'b', label:'No — migration is determined only by radial force', ok:false, rationale:'This confuses normal contact with the complete anchoring system.'},
      {id:'c', label:'Only if the silicone durometer is higher', ok:false, rationale:'Durometer is one input, but wall and surface architecture can dominate finished-device behavior.'},
    ], refs:'1' },
  { id:'covered-stress', title:'Stiffer device, lower peak tissue stress?',
    stem:'A thin membrane is bonded across a metallic mesh. Bench testing finds the free covered device is stiffer than the uncovered frame.',
    prompt:'Could the covered device still create lower modeled peak tissue stress?',
    choices:[
      {id:'a', label:'Yes — if the cover spreads contact over more area', ok:true, rationale:'A cover can raise device-level stiffness yet reduce local stress by distributing load. The tradeoff shifts to friction, migration, secretion transport, end loading, and membrane fatigue.'},
      {id:'b', label:'No — greater device stiffness always means greater tissue stress', ok:false, rationale:'This ignores contact distribution and the tissue-facing surface.'},
      {id:'c', label:'Only if friction is zero', ok:false, rationale:'Friction affects migration, but pressure distribution can change even at nonzero friction.'},
    ], refs:'2, 39' },
  { id:'fatigue', title:'Static pass, cyclic failure',
    stem:'A laser-cut scaffold passes a single static compression test but will sit across a high-motion curve for a prolonged dwell.',
    prompt:'Which test adds the most relevant missing information?',
    choices:[
      {id:'a', label:'Combined radial, bending, torsional, and cough-like fatigue', ok:true, rationale:'Respiration, cough, swallowing, neck motion, and curvature superimpose millions of cycles targeting the same connectors and outer-curve regions. Static compression alone cannot predict connector, wire, cover, or junction failure.'},
      {id:'b', label:'Repeat the same static compression once', ok:false, rationale:'A second static result still misses cyclic strain and combined loading.'},
      {id:'c', label:'Measure radiopacity only', ok:false, rationale:'Visibility matters but does not test connector or cover durability.'},
    ], refs:'14, 16, 26, 43' },
];
const CHECKLIST = [
  'Identify the exact size, architecture, material, cover, lot, and sterilization state.',
  'Condition the device at 37 °C in a stated medium; record preconditioning cycles.',
  'Report full loading and unloading curves over a clinically relevant diameter range.',
  'State fixture geometry, orientation, rate, endpoint, length normalization, and uncertainty.',
  'Pair bend force with minimum diameter or area retention at the same curvature.',
  'Test wet bidirectional migration after cough-like cyclic preconditioning.',
  'Match fatigue mode to placement: radial, bending, torsional, axial, cover, combined.',
  'Explain what the test simulates — and what it cannot predict clinically.',
];
const REFERENCES = [
  { id:1, tag:'peer-reviewed', c:'Jung HS, Chae G, Kim JH, et al. The mechanical characteristics and performance evaluation of a newly developed silicone airway stent (GINA stent). Sci Rep. 2021;11:7958.' },
  { id:2, tag:'peer-reviewed', c:'Ratnovsky A, Regev N, Wald S, Kramer M, Naftali S. Mechanical properties of different airway stents. Med Eng Phys. 2015;37:408-415.' },
  { id:3, tag:'peer-reviewed', c:'Ivanick N, Mahoney W, Pachimatla AG, et al. A retrospective comparison of silicone and hybrid metal tracheobronchial Y stents. J Thorac Dis. 2025;17:4701-4712.' },
  { id:12, tag:'peer-reviewed', c:'Isayama H, Nakai Y, Toyokawa Y, et al. Measurement of radial and axial forces of biliary self-expandable metallic stents. Gastrointest Endosc. 2009;70:37-44.' },
  { id:13, tag:'peer-reviewed', c:'Stoeckel D, Pelton A, Duerig T. Self-expanding nitinol stents: material and design considerations. Eur Radiol. 2004;14:292-301.' },
  { id:22, tag:'peer-reviewed', c:'Jiang Y, Shan Q, Huang W, et al. Multidimensional performance assessment of a novel Y-shaped airway stent. Biocybern Biomed Eng. 2024;44:534-542.' },
  { id:26, tag:'peer-reviewed', c:'Chung FT, et al. Factors leading to tracheobronchial self-expandable metallic stent fracture. J Thorac Cardiovasc Surg. 2008;136:1328-1335.' },
  { id:39, tag:'peer-reviewed', c:'McKenna CG, Vaughan TJ. A finite element investigation of the mechanical behavior of covered braided stents. J Mech Behav Biomed Mater. 2021;115:104305.' },
  { id:43, tag:'peer-reviewed', c:'Pelton AR, Schroeder V, Mitchell MR, et al. Fatigue and durability of nitinol stents. J Mech Behav Biomed Mater. 2008;1:153-164.' },
  { id:17, tag:'regulatory', c:'US FDA. 510(k) Summary K243126: DUMON Silicone Tracheobronchial Stent. 2024.' },
];

/* ================================================================= geometry primitives */
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// parallel-transport frames for a centerline; optional holonomy correction on closed loops
function frames(cl, closed) {
  const N = cl.length, T = [], NRM = [], BIN = [];
  for (let i = 0; i < N; i++) {
    const a = cl[Math.max(0, i - 1)], b = cl[Math.min(N - 1, i + 1)];
    T.push(new THREE.Vector3().subVectors(b, a).normalize());
  }
  const up = Math.abs(T[0].y) < 0.9 ? V(0, 1, 0) : V(1, 0, 0);
  NRM.push(new THREE.Vector3().crossVectors(T[0], up).normalize());
  BIN.push(new THREE.Vector3().crossVectors(T[0], NRM[0]).normalize());
  for (let i = 1; i < N; i++) {
    let n = NRM[i - 1].clone().addScaledVector(T[i], -NRM[i - 1].dot(T[i]));
    if (n.lengthSq() < 1e-8) n = NRM[i - 1].clone();
    n.normalize();
    NRM.push(n); BIN.push(new THREE.Vector3().crossVectors(T[i], n).normalize());
  }
  if (closed) {
    // distribute the seam frame mismatch (holonomy) evenly so ring N-1 ≈ ring 0
    const ref = new THREE.Vector3().crossVectors(T[0], up).normalize();
    let ang = Math.atan2(BIN[N - 1].dot(ref), NRM[N - 1].dot(ref));
    for (let i = 0; i < N; i++) {
      const a = -ang * (i / (N - 1));
      const c = Math.cos(a), s = Math.sin(a);
      const nn = NRM[i].clone().multiplyScalar(c).addScaledVector(BIN[i], s);
      const bb = BIN[i].clone().multiplyScalar(c).addScaledVector(NRM[i], -s);
      NRM[i] = nn; BIN[i] = bb;
    }
  }
  return { T, NRM, BIN };
}

// solid round wire sweep
function pushTube(cl, radius, seg, closed, pos, idx, centers) {
  const N = cl.length; if (N < 2) return;
  const { NRM, BIN } = frames(cl, closed);
  const base = pos.length / 3;
  for (let i = 0; i < N; i++)
    for (let j = 0; j < seg; j++) {
      const a = (j / seg) * Math.PI * 2, c = Math.cos(a) * radius, s = Math.sin(a) * radius;
      pos.push(cl[i].x + NRM[i].x * c + BIN[i].x * s, cl[i].y + NRM[i].y * c + BIN[i].y * s, cl[i].z + NRM[i].z * c + BIN[i].z * s);
      if (centers) centers.push(cl[i].x, cl[i].y, cl[i].z);
    }
  const rings = closed ? N : N - 1;
  for (let i = 0; i < rings; i++) {
    const i2 = (i + 1) % N;
    for (let j = 0; j < seg; j++) {
      const j2 = (j + 1) % seg;
      const a = base + i * seg + j, b = base + i * seg + j2, c = base + i2 * seg + j2, d = base + i2 * seg + j;
      idx.push(a, b, d, b, c, d);
    }
  }
}

// hollow WALL sweep: outer + reverse-wound inner + annular end caps (for silicone)
function sweepWall(cl, rOut, rInFrac, seg, pos, idx, centers, opts = {}) {
  const { capStart = true, capEnd = true } = opts;
  const rIn = rOut * rInFrac, N = cl.length; if (N < 2) return;
  const { NRM, BIN } = frames(cl, false);
  const base = pos.length / 3, stride = seg * 2;
  const put = (i, r) => {
    for (let j = 0; j < seg; j++) {
      const a = (j / seg) * Math.PI * 2, c = Math.cos(a) * r, s = Math.sin(a) * r;
      pos.push(cl[i].x + NRM[i].x * c + BIN[i].x * s, cl[i].y + NRM[i].y * c + BIN[i].y * s, cl[i].z + NRM[i].z * c + BIN[i].z * s);
      if (centers) centers.push(cl[i].x, cl[i].y, cl[i].z);
    }
  };
  for (let i = 0; i < N; i++) { put(i, rOut); put(i, rIn); }
  const O = (i, j) => base + i * stride + (j % seg);
  const I = (i, j) => base + i * stride + seg + (j % seg);
  for (let i = 0; i < N - 1; i++)
    for (let j = 0; j < seg; j++) {
      // outer wall (outward normals)
      idx.push(O(i, j), O(i, j + 1), O(i + 1, j), O(i, j + 1), O(i + 1, j + 1), O(i + 1, j));
      // inner wall (reverse winding → normals into lumen)
      idx.push(I(i, j), I(i + 1, j), I(i, j + 1), I(i, j + 1), I(i + 1, j), I(i + 1, j + 1));
    }
  if (capStart) for (let j = 0; j < seg; j++) idx.push(O(0, j), I(0, j), O(0, j + 1), O(0, j + 1), I(0, j), I(0, j + 1));
  if (capEnd) { const e = N - 1; for (let j = 0; j < seg; j++) idx.push(O(e, j), O(e, j + 1), I(e, j), I(e, j + 1), I(e, j) - 0, O(e, j + 1)); }
}

// low-poly stud (half-sphere) at a wall point, axis = outward radial dir
function pushStud(px, py, pz, nx, ny, nz, r, pos, idx, centers) {
  const rings = 4, seg = 7;
  const axis = V(nx, ny, nz).normalize();
  const tan = (Math.abs(axis.y) < 0.9 ? V(0, 1, 0) : V(1, 0, 0)).cross(axis).normalize();
  const bit = new THREE.Vector3().crossVectors(axis, tan).normalize();
  const base = pos.length / 3;
  for (let ri = 0; ri <= rings; ri++) {
    const phi = (ri / rings) * (Math.PI / 2);
    const rr = Math.sin(phi) * r, h = Math.cos(phi) * r;
    for (let j = 0; j < seg; j++) {
      const a = (j / seg) * Math.PI * 2;
      const ox = Math.cos(a) * rr, oy = Math.sin(a) * rr;
      pos.push(px + axis.x * h + tan.x * ox + bit.x * oy, py + axis.y * h + tan.y * ox + bit.y * oy, pz + axis.z * h + tan.z * ox + bit.z * oy);
      if (centers) centers.push(px, py, pz);
    }
  }
  for (let ri = 0; ri < rings; ri++)
    for (let j = 0; j < seg; j++) {
      const j2 = (j + 1) % seg;
      const a = base + ri * seg + j, b = base + ri * seg + j2, c = base + (ri + 1) * seg + j2, d = base + (ri + 1) * seg + j;
      idx.push(a, b, d, b, c, d);
    }
}

function finalize(pos, idx, centers) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const orig = Float32Array.from(pos);
  return { geometry: g, orig, centers: centers ? Float32Array.from(centers) : null };
}

/* ---- centerline generators (metal) ---- */
function crossBuild() {
  const N = 9, turns = 1.8, S = 150, weaveAmp = 0.032, wf = 2 * Math.PI * turns * N;
  const pos = [], idx = [];
  for (const fam of [1, -1])
    for (let i = 0; i < N; i++) {
      const phi = (2 * Math.PI * i) / N, cl = [];
      for (let s = 0; s <= S; s++) {
        const t = s / S, y = -LS / 2 + LS * t, th = phi + fam * 2 * Math.PI * turns * t;
        const rr = RS + fam * weaveAmp * Math.sin(wf * t + Math.PI / 2);
        cl.push(V(rr * Math.cos(th), y, rr * Math.sin(th)));
      }
      pushTube(cl, 0.03, 7, false, pos, idx);
    }
  return finalize(pos, idx);
}
function hookBuild() {
  const n = 6, g = 1.45, rows = 9, S = 320, amp = LS * 0.11, radOff = 0.03, span = LS - 2 * amp - 0.16, y0 = -span / 2;
  const pos = [], idx = [];
  for (let k = 0; k < rows; k++) {
    const yk = y0 + (span * k) / (rows - 1), phase = (k % 2) * (Math.PI / n), r = RS + (k % 2 ? -radOff : radOff), cl = [];
    for (let s = 0; s < S; s++) {
      const t = (2 * Math.PI * s) / S, u = n * t + phase * n, th = t - (g / n) * Math.sin(u), y = yk + amp * Math.cos(u);
      cl.push(V(r * Math.cos(th), y, r * Math.sin(th)));
    }
    pushTube(cl, 0.045, 7, true, pos, idx);
  }
  return finalize(pos, idx);
}
function zigBuild() {
  const n = 8, rows = 8, sub = 8, amp = LS * 0.085, span = LS - 2 * amp - 0.1, y0 = -span / 2;
  const pos = [], idx = [];
  for (let k = 0; k < rows; k++) {
    const yk = y0 + (span * k) / (rows - 1), corners = [];
    for (let c = 0; c < 2 * n; c++) corners.push([(Math.PI * c) / n, yk + (c % 2 ? -amp : amp)]);
    const cl = [];
    for (let c = 0; c < 2 * n; c++) {
      let [t0, ya] = corners[c], [t1, yb] = corners[(c + 1) % (2 * n)];
      if (t1 < t0) t1 += 2 * Math.PI;
      for (let s = 0; s < sub; s++) { const f = s / sub; cl.push(V(RS * Math.cos(t0 + (t1 - t0) * f), ya + (yb - ya) * f, RS * Math.sin(t0 + (t1 - t0) * f))); }
    }
    pushTube(cl, 0.05, 7, true, pos, idx);
  }
  return finalize(pos, idx);
}

/* ---- silicone builders ---- */
function siliconeStraightBuild(withCenters) {
  const S = 44, cl = [];
  for (let i = 0; i <= S; i++) cl.push(V(0, -LS / 2 + LS * (i / S), 0));
  const pos = [], idx = [], centers = withCenters ? [] : null;
  sweepWall(cl, RS, 0.79, 84, pos, idx, centers);
  return finalize(pos, idx, centers);
}
function studdedSiliconeBuild() {
  const S = 44, cl = [];
  for (let i = 0; i <= S; i++) cl.push(V(0, -LS / 2 + LS * (i / S), 0));
  const pos = [], idx = [];
  sweepWall(cl, RS, 0.80, 80, pos, idx, null);
  const rows = 7, cols = 8, studR = 0.075, yTop = LS / 2 - 0.28, yBot = -LS / 2 + 0.28;
  for (let r = 0; r < rows; r++) {
    const y = yBot + (yTop - yBot) * (r / (rows - 1)), off = (r % 2) * (Math.PI / cols);
    for (let cI = 0; cI < cols; cI++) {
      const th = off + (2 * Math.PI * cI) / cols, cx = Math.cos(th), cz = Math.sin(th);
      pushStud(RS * cx, y, RS * cz, cx, 0, cz, studR, pos, idx, null);
    }
  }
  return finalize(pos, idx);
}
function siliconeYBuild() {
  const pos = [], idx = [], centers = [];
  const yc = -0.15;                    // carina height
  const rMain = 0.66, rLimb = 0.5;
  // tracheal limb
  const m = [];
  for (let i = 0; i <= 26; i++) m.push(V(0, yc + (LS / 2 - yc) * (i / 26), 0));
  sweepWall(m, rMain, 0.76, 40, pos, idx, centers, { capEnd: true, capStart: false });
  // two bronchial limbs from the carina
  for (const dir of [-1, 1]) {
    const ang = 33 * DEG, len = 1.5, l = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20, s = t * len;
      l.push(V(dir * Math.sin(ang) * s, yc - Math.cos(ang) * s, 0));
    }
    sweepWall(l, rLimb, 0.74, 34, pos, idx, centers, { capStart: false, capEnd: true });
  }
  return finalize(pos, idx, centers);
}

/* ================================================================= physics */
function lengthFactor(d, sin2) {
  if (sin2 <= 1e-6) return 1;
  return Math.sqrt(Math.max(1e-4, 1 - d * d * sin2)) / Math.sqrt(1 - sin2);
}
// stiffer stents compress LESS under the same applied load
function compliance(T) { return Math.min(2.0, Math.max(0.6, 0.62 / T.stiffness)); }

function deformContinuum(sin2, d, e, phi, kink) {
  const p = mesh.geometry.attributes.position, arr = p.array, n = arr.length;
  const Lf = lengthFactor(d, sin2), Lcur = LS * Lf, R = phi > 1e-3 ? Lcur / phi : 0;
  for (let i = 0; i < n; i += 3) {
    let x = orig[i] * d * (1 + e), y = orig[i + 1] * Lf, z = orig[i + 2] * d * (1 - e);
    if (kink > 0) {                       // local lumen pinch at the bend apex (stiff struts)
      const w = Math.exp(-((y / (LS * 0.16)) ** 2));
      const f = 1 - kink * 0.5 * w;
      x *= f; z *= f;
    }
    if (phi > 1e-3) {                      // symmetric C-bend: arc centred on origin, ends at ±φ/2
      const al = y / R, ca = Math.cos(al), sa = Math.sin(al);
      const Xc = R - R * ca, Yc = R * sa;  // centreline
      const nx = Xc + x * ca, ny = Yc - x * sa;  // + in-plane radial offset along rotated normal
      x = nx; y = ny;
    }
    arr[i] = x; arr[i + 1] = y; arr[i + 2] = z;
  }
  p.needsUpdate = true;
  return Lf;
}
function deformYSeating(d) {
  // radial seating about each limb centreline only; no bend, no foreshorten
  const p = mesh.geometry.attributes.position, arr = p.array, n = arr.length;
  for (let i = 0; i < n; i += 3) {
    arr[i] = centers[i] + (orig[i] - centers[i]) * d;
    arr[i + 1] = orig[i + 1];
    arr[i + 2] = centers[i + 2] + (orig[i + 2] - centers[i + 2]) * d;
  }
  p.needsUpdate = true;
  return 1;
}
function deformCover(sin2, d, e, phi) {
  if (!coverMesh) return;
  const p = coverMesh.geometry.attributes.position, arr = p.array, n = arr.length;
  const Lf = lengthFactor(d, sin2), Lcur = LS * Lf, R = phi > 1e-3 ? Lcur / phi : 0;
  for (let i = 0; i < n; i += 3) {
    let x = origCover[i] * d * (1 + e), y = origCover[i + 1] * Lf, z = origCover[i + 2] * d * (1 - e);
    if (phi > 1e-3) { const al = y / R, ca = Math.cos(al), sa = Math.sin(al); const Xc = R - R * ca, Yc = R * sa; const nx = Xc + x * ca, ny = Yc - x * sa; x = nx; y = ny; }
    arr[i] = x; arr[i + 1] = y; arr[i + 2] = z;
  }
  p.needsUpdate = true;
}

    phase = comp > 0.5 ? 'Expiration — dynamic narrowing' : 'Inspiration — airway opens';
  }
  if (state.coughT >= 0) {
    const dt = (now - state.coughT) / 1000;
    if (dt < 1.4) {
      dyn += 0.20 * Math.exp(-dt * 2.6);
      stress = Math.max(stress || 0, 6.0 + 1.25 * Math.exp(-dt * 2.6));   // cough peak 7.25 kPa
      phase = 'Cough — transient pressure spike';
      if (state.balloon && dt > 0.4 && state.residual < 0.16) state.residual = 0.16;
    } else state.coughT = -1;
  }
  const applied = Math.min(0.62, (load + dyn + state.residual));
  const c = Math.min(0.64, applied * compliance(T));   // stiffness coupling: stiffer compresses less
  if (load > 0 && phase === 'Free deployed state') phase = 'Static radial load';
  if (state.residual > 0) phase = 'Residual set — balloon-expandable, no recoil';
  // Apparent PEAK wall stress. Two regimes, shown as whichever dominates (not summed,
  // so dynamic peaks stay within Ratnovsky's cited values):
  //  • static — focal contact stress from steady load; focal wire/strut contact concentrates
  //    load (high peak), a broad silicone wall spreads it (low peak) → laser-cut > braided > silicone.
  //  • dynamic — physiologic airway wall stress cycling with breathing/cough (Ratnovsky).
  const CONC = { cross: 0.82, hook: 0.86, zig: 1.0, siliSmooth: 0.45, siliStud: 0.72, siliY: 0.58 };
  const staticLoad = state.rad / 100 + state.residual;
  const contact = staticLoad * (CONC[state.type] || 0.7) * 8.6;
  let wall = null;
  if (stress != null) wall = Math.max(stress, contact);
  else if (staticLoad > 0) wall = contact;
  return { c, applied, wall, phase };
}

/* ================================================================= render */
function deform(now = performance.now()) {
  const T = TYPES[state.type];
  const sin2 = Math.sin(T.braidAngleDeg * DEG) ** 2;
  const ls = loadState(now);
  const d = 1 - ls.c;
  const e = T.deformMode === 'ySeating' ? 0 : state.oval / 100;
  const phi = (T.canBend && sceneCfg.controls) ? state.bend * DEG : 0;
  const kink = (T.kink && state.bend > 40) ? Math.min(1, (state.bend - 40) / 20) : 0;

  let Lf = 1;
  if (T.deformMode === 'ySeating') Lf = deformYSeating(d);
  else { Lf = deformContinuum(sin2, d, e, phi, kink); deformCover(sin2, d, e, phi); }
  mesh.geometry.computeVertexNormals();
  if (coverMesh && coverMesh.visible) coverMesh.geometry.computeVertexNormals();

  state.stress = ls.wall; state.phaseLabel = ls.phase;
  updateReadouts(T, d, e, phi, Lf, sin2, ls);
  updateCamTarget(d, e, phi, Lf, T);
}

function updateCamTarget(d, e, phi, Lf, T) {
  let halfLen, radial;
  if (T.deformMode === 'ySeating') { halfLen = 1.95; radial = 1.55; }
  else {
    const Lcur = LS * Lf, R = phi > 1e-3 ? Lcur / phi : 0;
    const sag = phi > 1e-3 ? R * (1 - Math.cos(phi / 2)) : 0;
    halfLen = Lcur / 2 + sag + 0.15;
    radial = RS * d * (1 + e) + (T.siliconeWall ? 0.12 : 0.06) + sag * 0.5;
  }
  const bound = Math.hypot(halfLen, radial);
  const fovY = camera.fov * DEG, fovMin = fovY * Math.min(1, camera.aspect || 1);
  camTargetDist = (bound / Math.sin(fovMin / 2)) * 1.16;
}

/* ================================================================= readouts */
const $ = id => document.getElementById(id);
function updateReadouts(T, d, e, phi, Lf, sin2, ls) {
  if (!sceneCfg.controls) return;
  const diaMm = D0_MM * d, lenMm = L0_MM * Lf;
  const deployFs = (1 - 1 / Lf) * 100, maxFs = (1 - Math.sqrt(1 - sin2)) * 100;
  set('dOut', diaMm.toFixed(1), 'mm'); set('lOut', lenMm.toFixed(1), 'mm');
  const fs = $('fsOut'); if (fs) {
    fs.innerHTML = deployFs.toFixed(1) + '<small> %</small>';
    $('fsBar').style.width = Math.min(100, deployFs / 40 * 100) + '%';
    $('fsNote').textContent = sin2 <= 1e-6
      ? 'Silicone / solid wall: no wires to unwind, so length never tracks diameter — 0% foreshortening. It lands exactly where you place it.'
      : (state.type === 'zig'
        ? 'Laser-cut Z-rings: shortening ratio ≈ 0 (Jeong 2016). Even fully constrained it shortens only ~' + maxFs.toFixed(0) + '% on deployment.'
        : 'Braided: diameter and length are coupled. As it re-expands toward ' + D0_MM + ' mm it foreshortens — up to ~' + maxFs.toFixed(0) + '% from fully constrained. Account for this when positioning.');
  }
  const st = $('stiffOut'); if (st) { st.textContent = Math.round(T.stiffness * 100); $('stiffBar').style.width = (T.stiffness * 100) + '%'; }
  const ss = $('stressOut'); if (ss) {
    if (ls.wall == null) { ss.innerHTML = '—<small> kPa</small>'; $('stressBar').style.width = '0%'; }
    else { ss.innerHTML = ls.wall.toFixed(1) + '<small> kPa</small>'; $('stressBar').style.width = Math.min(100, ls.wall / 11 * 100) + '%'; }
  }
  const pl = $('phaseLabel'); if (pl) pl.textContent = ls.phase;
  $('phaseDot').style.background = state.residual > 0 ? '#f87171' : state.coughT >= 0 ? '#fbbf24' : '#4cc2ff';
  updateCaption(T, ls, phi, maxFs, d);
}
function set(id, v, unit) { const el = $(id); if (el) el.innerHTML = v + (unit ? '<small> ' + unit + '</small>' : ''); }

function updateCaption(T, ls, phi, maxFs, d) {
  const el = $('caption'); if (!el) return;
  const bits = [];
  if (ls.applied > 0.01) {
    const soft = T.stiffness < 0.5;
    bits.push('Under the same load this ' + T.short.toLowerCase() + ' (stiffness ' + Math.round(T.stiffness * 100) + ') narrows to <b>' + (D0_MM * d).toFixed(1) + ' mm</b> — ' +
      (soft ? 'low radial force lets it <b>squash more</b>.' : 'high radial force <b>resists compression</b>.') + ' ' +
      (T.braidAngleDeg === 0 ? 'No wires → <b>no foreshortening</b>.' : (T.short === 'Laser-cut' ? 'Rings hold length nearly constant.' : 'Watch it <b>lengthen</b> as it narrows — the coupling that foreshortens it on deployment.')));
  }
  if (phi > 0.02) {
    bits.push('At <b>' + state.bend + '°</b> the inner wall shortens and the outer wall stretches. ' +
      (T.kink && state.bend > 40 ? '<b style="color:#fca5a5">Stiff struts hinge — the lumen pinches (kink).</b>' : 'High axial force would push load onto the ends (Jeong 2016).'));
  }
  if (state.oval > 1 && T.deformMode !== 'ySeating') bits.push('Eccentric constraint <b>ovalizes</b> the cross-section — the average diameter can look adequate while the minor axis stays narrow.');
  if (!bits.length) bits.push(T.deformMode === 'ySeating'
    ? 'A silicone Y-stent resists migration by <b>carinal seating</b>, not radial force. Bend and foreshortening do not apply — the teaching point is geometric fixation.'
    : 'Free, fully deployed at <b>' + D0_MM + ' mm</b>. Apply a force, start breathing, or trigger a cough. ' + (T.braidAngleDeg === 0 ? 'Silicone does not foreshorten.' : 'This ' + T.short.toLowerCase() + ' foreshortens up to <b>~' + maxFs.toFixed(0) + '%</b>.'));
  el.innerHTML = bits.join(' ');
}

/* ================================================================= resize + loop */
function resize() {
  const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || Math.round(window.innerHeight * 0.56);
  if (w < 1 || h < 1) return;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(stage);

function loop() {
  requestAnimationFrame(loop);
  const animating = state.breathing || state.coughT >= 0;
  if (state.spin) stentGroup.rotation.y += 0.0035; else stentGroup.rotation.y *= 0.98;
  if (dirty || animating) { deform(); dirty = false; }
  // damped camera auto-fit (never fight an active orbit; only enforce distance)
  if (!userInteracting) {
    const dir = camera.position.clone().sub(controls.target);
    const cur = dir.length(), want = THREE.MathUtils.clamp(camTargetDist, controls.minDistance, controls.maxDistance);
    if (Math.abs(cur - want) > 0.02) { dir.setLength(cur + (want - cur) * 0.06); camera.position.copy(controls.target).add(dir); }
  }
  controls.update();
  renderer.render(scene, camera);
}

/* ================================================================= boot */
buildType('cross');
goToSection(0);
resize();
loop();

/* verification hook (deterministic frame stepping; rAF throttles when backgrounded) */
window.__lab = {
  state, TYPES,
  types() { return TYPE_ORDER; },
  setType(id) { switchType(id); if (SECTIONS[state.section].kind === 'interactive') renderRail(SECTIONS[state.section]); deform(); },
  setForces(f = {}) { Object.assign(state, f); dirty = true; deform(); },
  section(i) { goToSection(i); deform(); },
  step(frames = 1, now = performance.now()) { for (let i = 0; i < frames; i++) deform(now + i * 16.7); },
  readout() { return { dia: txt('dOut'), len: txt('lOut'), fs: txt('fsOut'), stiff: txt('stiffOut'), stress: txt('stressOut'), phase: txt('phaseLabel') }; },
  bbox() {
    mesh.geometry.computeBoundingBox();
    const bb = mesh.geometry.boundingBox.clone(); bb.applyMatrix4(mesh.matrixWorld);
    const pts = [], mn = bb.min, mx = bb.max;
    for (const x of [mn.x, mx.x]) for (const y of [mn.y, mx.y]) for (const z of [mn.z, mx.z]) {
      const v = new THREE.Vector3(x, y, z).project(camera); pts.push(v);
    }
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    return { world: { min: mn.toArray().map(n => +n.toFixed(3)), max: mx.toArray().map(n => +n.toFixed(3)) },
      ndc: { xMin: +Math.min(...xs).toFixed(3), xMax: +Math.max(...xs).toFixed(3), yMin: +Math.min(...ys).toFixed(3), yMax: +Math.max(...ys).toFixed(3) },
      inView: Math.max(...xs.map(Math.abs)) <= 1 && Math.max(...ys.map(Math.abs)) <= 1 };
  },
};
function txt(id) { const el = document.getElementById(id); return el ? el.textContent : null; }
</script>
