# Place `proxy_cache_path` in the `http { ... }` block. Place the remaining directives inside the
# `server { ... }` block for interventionalpulm.org.
# Replace the proxy_pass origin with:
# https://<project-ref>.supabase.co/storage/v1/object/public/module-assets/v1/

proxy_cache_path /var/cache/nginx/interventionalpulm-module-assets
    levels=1:2
    keys_zone=interventionalpulm_module_assets:100m
    max_size=20g
    inactive=30d
    use_temp_path=off;

gzip on;
gzip_vary on;
gzip_static on;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    model/gltf+json
    text/css
    text/html
    text/plain;

# Uncomment if the Brotli module is installed on the VPS.
# brotli on;
# brotli_static on;
# brotli_comp_level 6;
# brotli_types application/javascript application/json application/wasm image/svg+xml text/css text/html text/plain;

location /module-assets/v1/ {
    proxy_pass https://tqnhxlwvkkswuckszlee.supabase.co/storage/v1/object/public/module-assets/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host tqnhxlwvkkswuckszlee.supabase.co;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;

    proxy_cache interventionalpulm_module_assets;
    proxy_cache_lock on;
    proxy_cache_valid 200 206 30d;
    proxy_cache_valid 404 1m;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    add_header X-Module-Asset-Cache $upstream_cache_status always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Compatibility proxies let existing embedded-app asset URLs keep working after the large payloads
# are removed from the repo and uploaded under module-assets/v1.
location ~ ^/socal-ebus-course/app/(media|simulator|pipelines)/(.*)$ {
    rewrite ^/socal-ebus-course/app/(.*)$ /module-assets/v1/socal-ebus-course/app/$1 last;
}

location ~ ^/socal-ebus-course/app/assets/(.*\.(?:glb|nrrd|png|jpg|jpeg|webp|wasm|zst))$ {
    rewrite ^/socal-ebus-course/app/(.*)$ /module-assets/v1/socal-ebus-course/app/$1 last;
}

location ~ ^/bronch-navigation-trainer/app/cases/(.*)$ {
    rewrite ^/bronch-navigation-trainer/app/(.*)$ /module-assets/v1/bronch-navigation-trainer/app/$1 last;
}

location ~ ^/airway-anatomy/(.*)$ {
    rewrite ^/(.*)$ /module-assets/v1/$1 last;
}

location ~ ^/(fluoroview|models|draco)/(.*)$ {
    rewrite ^/(.*)$ /module-assets/v1/$1 last;
}
